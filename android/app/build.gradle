plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace "com.krisdiamondshop.admin"
    compileSdk 35

    defaultConfig {
        applicationId "com.krisdiamondshop.admin"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "ADMIN_URL", "\"https://krisdiamondshop.vercel.app/admin\""
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "com.google.firebase:firebase-messaging:24.1.1"
}
